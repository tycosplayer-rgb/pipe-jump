<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>水管工大冒险 · Pipe Jump</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="rotate-hint" role="status" aria-live="polite">
    <div class="rotate-card">
      <span class="rotate-icon" aria-hidden="true">⟳</span>
      <span>请将手机横过来游玩</span>
    </div>
  </div>

  <div id="game-wrap">
    <!-- Left gutter: joystick outside the playfield -->
    <aside id="rail-left" class="control-rail" aria-label="移动区域">
      <div id="joystick" class="joystick">
        <div class="joystick-base"></div>
        <div id="joystick-knob" class="joystick-knob"></div>
      </div>
    </aside>

    <div id="stage">
      <canvas id="game" width="800" height="480"></canvas>
    </div>

    <!-- Right gutter: jump zone + pause outside the playfield -->
    <aside id="rail-right" class="control-rail" aria-label="跳跃与暂停">
      <button type="button" id="btn-pause" class="touch-pause" data-key="p" aria-label="暂停">Ⅱ</button>
      <div id="jump-zone" class="jump-zone" aria-label="跳跃区域"></div>
    </aside>
  </div>
  <script src="js/game.js"></script>
</body>
</html>

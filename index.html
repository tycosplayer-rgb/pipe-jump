<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="landscape" />
  <meta name="theme-color" content="#1a1a2e" />
  <title>水管工大冒险 · Pipe Jump</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Fixed overlay: does not reserve layout height -->
  <div id="rotate-hint" role="status" aria-live="polite">
    <div class="rotate-card">
      <span class="rotate-icon" aria-hidden="true">⟳</span>
      <span>请将手机横过来游玩</span>
    </div>
  </div>

  <div id="game-wrap">
    <div id="stage">
      <canvas id="game" width="800" height="480"></canvas>

      <div id="touch-controls" aria-hidden="false">
        <div class="touch-cluster touch-move">
          <button type="button" class="touch-btn" data-key="left" aria-label="向左">◀</button>
          <button type="button" class="touch-btn" data-key="right" aria-label="向右">▶</button>
        </div>
        <div class="touch-cluster touch-action">
          <button type="button" class="touch-btn touch-pause" data-key="p" aria-label="暂停">Ⅱ</button>
          <button type="button" class="touch-btn touch-jump" data-key="space" aria-label="跳跃">跳</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
